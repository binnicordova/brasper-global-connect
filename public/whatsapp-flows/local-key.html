<!doctype html>
<html lang="es">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><meta
    name="robots"
    content="noindex"
  /><title>Brasper · Clave local</title
  ><style>
    body {
      font: 16px system-ui;
      background: #f2f6f9;
      color: #122344;
      margin: 0;
      padding: 24px;
    }
    main {
      max-width: 460px;
      margin: 8vh auto;
      background: white;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 12px 45px #12234410;
    }
    h1 {
      font-size: 28px;
    }
    label {
      display: block;
      margin: 24px 0 10px;
    }
    input,
    button {
      box-sizing: border-box;
      font: inherit;
      padding: 15px;
      border-radius: 12px;
      width: 100%;
    }
    input {
      border: 1px solid #ccd5df;
    }
    button {
      border: 0;
      background: #008575;
      color: white;
      margin-top: 16px;
      cursor: pointer;
    }
    p {
      line-height: 1.6;
    }
    a {
      color: #008575;
    }
    #status {
      white-space: pre-wrap;
    }
  </style>
  <main>
    <h1>Conecta el asistente</h1>
    <p>
      Pega tu clave de OpenAI. Se guarda únicamente en el servidor local, en
      <code>.env.local</code>, fuera de Git.
    </p>
    <form id="form">
      <label for="key">OPENAI_API_KEY</label
      ><input
        id="key"
        type="password"
        required
        autocomplete="off"
        spellcheck="false"
        placeholder="sk-…"
      /><button id="save">Guardar clave local</button>
    </form>
    <p id="status" role="status"></p>
    <a href="./preview-beta.html">Abrir asistente Brasper →</a>
  </main>
  <script>
    const form = document.getElementById("form"),
      input = document.getElementById("key"),
      status = document.getElementById("status"),
      button = document.getElementById("save");
    if (!["127.0.0.1", "localhost", "[::1]"].includes(location.hostname)) {
      form.hidden = true;
      status.textContent = "Esta configuración solo funciona en local.";
    }
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      button.disabled = true;
      status.textContent = "Guardando…";
      try {
        const r = await fetch("/api/assistant-setup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key: input.value }),
        });
        const d = await r.json();
        status.textContent = d.message || d.error || "No se pudo guardar.";
        if (r.ok) {
          input.value = "";
          form.hidden = true;
        }
      } catch {
        status.textContent = "No se pudo conectar con el servidor local.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</html>
