# The worker authenticates POST requests with BILLING_WORKER_SECRET.
# It must never be invoked using a public browser key.
[functions.process-invoices]
verify_jwt = false

# Local configuration; enable the same options in the connected Lovable/Supabase project.
[auth]
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = true

# Meta signature and session JWT are validated inside the functions.
[functions.whatsapp-webhook]
verify_jwt = false
[functions.whatsapp-session]
verify_jwt = false

# Native Flow checks Meta's signature, encrypted envelope and signed session.
[functions.whatsapp-flow]
verify_jwt = false
